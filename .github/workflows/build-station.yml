name: Build Station

on:
  workflow_dispatch:

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          lfs: true
      - name: Install system python deps
        run: sudo apt update && sudo apt install python3-ply python3-pil libjpeg-dev zlib1g-dev
      - name: Get setuptools
        run: pip install --upgrade setuptools
      - name: Install python deps
        run: pip install -r requirements.txt
      - name: Generate station
        run: make station; mkdir release; mv station.grf release/
      - name: Pack documentation
        run: cp docs/changelog.md release/changelog.txt; cp docs/readme.md release/readme.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: china-set-stations-wuhu
          path: release
          retention-days: 7
